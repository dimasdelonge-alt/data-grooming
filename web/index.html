<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Aplikasi Manajemen Grooming & Hotel Kucing">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Data Grooming App">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>DataGroomingApp</title>
  <link rel="manifest" href="manifest.json">

  <!-- pdf.js required for printing package to rasterize PDF to PNG on web -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.min.js"></script>
  <script type="text/javascript">
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.12.313/pdf.worker.min.js";
  </script>
</head>

<body>
  <!-- Splash Screen -->
  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .cat-container {
      position: relative;
      margin-bottom: 40px;
      animation: catBounce 2s ease-in-out infinite;
    }

    .cat-emoji {
      font-size: 80px;
      filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
    }

    .hello-bubble {
      position: absolute;
      top: -30px;
      right: -40px;
      background: #ffa726;
      color: #000;
      padding: 6px 12px;
      border-radius: 15px 15px 15px 0;
      font-family: sans-serif;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      animation: bubblePop 4s infinite;
      opacity: 0;
    }

    @keyframes catBounce {
      0%, 100% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(-15px) rotate(5deg); }
    }

    @keyframes bubblePop {
      0%, 10% { opacity: 0; transform: scale(0.5) translate(-10px, 10px); }
      15%, 45% { opacity: 1; transform: scale(1) translate(0, 0); }
      50%, 100% { opacity: 0; transform: scale(0.8); }
    }

    .splash-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
      margin-bottom: 4px;
      animation: fadeInUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s both;
    }
    
    .splash-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: rgba(255, 167, 38, 0.9);
      letter-spacing: 2px;
      animation: fadeInUp 1s ease 0.8s both;
    }

    .loading-bar {
      width: 280px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      margin-top: 30px;
      overflow: hidden;
      animation: fadeInUp 1s ease 1s both;
    }

    .loading-bar-inner {
      width: 40%;
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #ff6b35, #ffa726);
      animation: loadSlide 1.2s ease infinite;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes loadSlide {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(350%);
      }
    }
  </style>

  <div id="splash">
    <div class="cat-container">
      <div class="cat-emoji">😸</div>
      <div class="hello-bubble">Hallo! 🐾</div>
    </div>
    <div class="splash-title">Data Grooming App</div>
    <div class="splash-sub">LOADING</div>
    <div class="loading-bar">
      <div class="loading-bar-inner"></div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      splash.classList.add('hidden');
      setTimeout(function () { splash.remove(); }, 600);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
